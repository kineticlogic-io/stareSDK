# Fails when npm and GitHub releases disagree: a version on npm without a
# matching GitHub release (tag on the commit npm built from), or a release that
# never reached npm. Runs after every publish, on main, and daily.
name: release-sync
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [publish]
    types: [completed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-release-sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}
