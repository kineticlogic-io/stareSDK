# Publishes to npm when a GitHub release is published. Uses npm trusted
# publishing (OIDC): on npmjs.com, package settings -> Trusted publishers,
# add this repository and workflow (publish.yml). No token is stored.
#
# The release and the npm version must match: the tag is v<package.json
# version>, and npm's copy is built from the tagged commit. A release for a
# version npm already has from that same commit (a backfilled release) passes
# without publishing; one from any other commit fails.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Release tag matches package.json
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Not already on npm from another commit
        id: existing
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! npm view "$NAME@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(npm view "$NAME@$VERSION" gitHead --prefer-online)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::npm already has $NAME@$VERSION, built from ${head:-an unknown commit}, not $GITHUB_SHA. Bump the version."
            exit 1
          fi
          echo "::notice::npm already has $NAME@$VERSION from $GITHUB_SHA; nothing to publish."
          echo "published=true" >> "$GITHUB_OUTPUT"
      - if: steps.existing.outputs.published == 'false'
        run: npm install -g npm@latest
      - if: steps.existing.outputs.published == 'false'
        run: npm ci --legacy-peer-deps
      - if: steps.existing.outputs.published == 'false'
        run: npm run check
      - if: steps.existing.outputs.published == 'false'
        run: |
          if [ "$PRERELEASE" = "true" ]; then npm publish --access public --tag next
          else npm publish --access public; fi
      - name: npm has the tagged commit
        if: steps.existing.outputs.published == 'false'
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 12); do
            head=$(npm view "$NAME@$VERSION" gitHead --prefer-online 2>/dev/null || true)
            if [ "$head" = "$GITHUB_SHA" ]; then echo "npm $NAME@$VERSION is $GITHUB_SHA"; exit 0; fi
            sleep 10
          done
          echo "::error::npm $NAME@$VERSION reports gitHead '${head}', expected $GITHUB_SHA."
          exit 1
