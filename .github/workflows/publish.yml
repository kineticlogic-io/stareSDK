# Publishes to npm when a GitHub release is published. Uses npm trusted
# publishing (OIDC): on npmjs.com, package settings -> Trusted publishers,
# add this repository and workflow (publish.yml). No token is stored.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm publish --access public
